{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
  <div class="column is-half is-offset-one-quarter">
    <h1 class="title">Sign Up</h1>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label class="label">Username</label>
        <div class="control">{{ form.username }}</div>
      </div>
      <div class="field">
        <label class="label">Email</label>
        <div class="control">{{ form.email }}</div>
      </div>
      <div class="field">
        <label class="label">First Name</label>
        <div class="control">{{ form.first_name }}</div>
      </div>
      <div class="field">
        <label class="label">Last Name</label>
        <div class="control">{{ form.last_name }}</div>
      </div>
      <div class="field">
        <label class="label">Password</label>
        <div class="control">{{ form.password1 }}</div>
      </div>
      <div class="field">
        <label class="label">Confirm Password</label>
        <div class="control">{{ form.password2 }}</div>
      </div>
      <div class="field">
        <div class="control">
          <button class="button is-primary" type="submit">Register</button>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
