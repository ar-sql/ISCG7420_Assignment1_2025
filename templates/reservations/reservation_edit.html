{% extends 'base.html' %}
{% block title %}Edit Reservation{% endblock %}

{% block content %}
  <h1 class="title">Edit Reservation for {{ reservation.room.name }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="buttons">
      <button class="button is-primary" type="submit">Save Changes</button>
      <a class="button" href="{% url 'my_reservations' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
